services:
  estudio:
    build: .
    image: estudio-dunlosky:1.0
    container_name: estudio-dunlosky
    ports:
      - "${PUERTO:-8000}:8000"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - AUTH=${AUTH:-1}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-1}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - OPENALEX_API_KEY=${OPENALEX_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      # buscador de toda la web (el servicio "buscador" de abajo)
      - SEARXNG_URL=${SEARXNG_URL:-http://buscador:8080}
    restart: unless-stopped

  # SearXNG: metabuscador libre que consulta a la vez Google, Bing, DuckDuckGo, Brave, Qwant,
  # Startpage, Wikipedia y muchos más, sin claves. Solo es accesible desde la app (no abre puertos).
  buscador:
    image: searxng/searxng:latest
    container_name: estudio-dunlosky-buscador
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://buscador:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-estudio-dunlosky-clave-interna-del-buscador}
      - SEARXNG_LIMITER=false
    restart: unless-stopped
