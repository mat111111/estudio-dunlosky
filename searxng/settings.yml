# Configuración del buscador SearXNG que usa Estudio Dunlosky para buscar en toda la web.
# Toma la configuración por defecto de SearXNG y solo cambia lo necesario.
use_default_settings: true

general:
  instance_name: "Buscador de Estudio Dunlosky"

server:
  # La clave real se toma de la variable SEARXNG_SECRET (docker-compose); esta es solo un respaldo.
  secret_key: "estudio-dunlosky-cambiame-por-una-clave-larga"
  # Solo lo usa la app desde la red interna de Docker: no hace falta limitar pedidos.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  default_lang: "es"
  autocomplete: ""
  # La app consulta la API en formato JSON
  formats:
    - html
    - json

ui:
  default_locale: "es"
